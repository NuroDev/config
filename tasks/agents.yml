---
- name: Configure Claude Code
  environment:
    PATH: >-
      {{ ansible_facts['env']['HOME'] }}/.local/share/vite-plus/bin:{{
      homebrew_prefix }}/bin:{{ ansible_facts['env']['PATH'] }}
  block:
    - name: Ensure the parent directory for the shared config link exists
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config"
        state: directory
        mode: '0755'

    - name: Link shared agent config into place
      ansible.builtin.file:
        src: "{{ agents_shared_dir }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.config/agents"
        state: link

    - name: Ensure the Claude Code skill directory exists
      ansible.builtin.file:
        path: "{{ claude_skills_dir | expanduser }}"
        state: directory
        mode: '0755'

    - name: Link shared skills into Claude Code
      ansible.builtin.file:
        src: "{{ agents_shared_dir }}/skills/{{ item }}"
        dest: "{{ claude_skills_dir | expanduser }}/{{ item }}"
        state: link
      loop: "{{ agent_skills }}"

    - name: Read existing Claude Code settings
      ansible.builtin.slurp:
        src: "{{ ansible_facts['env']['HOME'] }}/.claude/settings.json"
      register: claude_settings_existing
      failed_when: false

    - name: Merge managed Claude Code settings
      ansible.builtin.copy:
        dest: "{{ ansible_facts['env']['HOME'] }}/.claude/settings.json"
        content: >-
          {{ claude_settings_existing.content | default('e30=')
          | b64decode | from_json
          | combine(claude_settings, recursive=True) | to_nice_json }}
        mode: '0600'

    - name: Get registered Claude Code marketplaces
      ansible.builtin.command:
        cmd: claude plugin marketplace list --json
      register: claude_registered_marketplaces
      changed_when: false
      check_mode: false

    # `claude plugin install` only resolves marketplaces already on
    # disk; it never reads the settings file written above.
    - name: Register missing Claude Code marketplaces
      ansible.builtin.command:
        argv:
          - claude
          - plugin
          - marketplace
          - add
          - "{{ item.value.source.repo | default(item.value.source.url) }}"
          - --scope
          - user
      loop: >-
        {{ claude_settings.extraKnownMarketplaces | default({}) | dict2items }}
      loop_control:
        label: "{{ item.key }}"
      when: >-
        item.key not in (claude_registered_marketplaces.stdout | from_json
        | map(attribute='name') | list)

    - name: Get installed Claude Code plugins
      ansible.builtin.command:
        cmd: claude plugin list --json
      register: claude_installed_plugins
      changed_when: false
      check_mode: false

    - name: Select the Claude Code plugins still to install
      ansible.builtin.set_fact:
        claude_missing_plugins: >-
          {{ claude_plugins | difference(claude_installed_plugins.stdout
          | from_json | selectattr('scope', 'equalto', 'user')
          | map(attribute='id') | list) }}

    - name: Refresh Claude Code marketplaces before installing
      ansible.builtin.command:
        cmd: claude plugin marketplace update
      changed_when: false
      when: claude_missing_plugins | length > 0

    - name: Install missing Claude Code plugins
      ansible.builtin.command:
        argv:
          - claude
          - plugin
          - install
          - "{{ item }}"
          - --scope
          - user
          - --yes
      loop: "{{ claude_missing_plugins }}"

    - name: Uninstall retired Claude Code plugins
      ansible.builtin.command:
        argv:
          - claude
          - plugin
          - uninstall
          - "{{ item }}"
          - --scope
          - user
      loop: >-
        {{ claude_plugins_retired | intersect(claude_installed_plugins.stdout
        | from_json | selectattr('scope', 'equalto', 'user')
        | map(attribute='id') | list) }}

    - name: Remove retired Claude Code marketplaces
      ansible.builtin.command:
        argv:
          - claude
          - plugin
          - marketplace
          - remove
          - "{{ item }}"
      loop: >-
        {{ claude_marketplaces_retired
        | intersect(claude_registered_marketplaces.stdout
        | from_json | map(attribute='name') | list) }}
