---
# TODO: Use sudo once .osx can be run via root with no user interaction.
- name: Run .osx dotfiles
  command: "{{ osx_script }}"
  changed_when: false

- name: Create SSH key
  community.crypto.openssh_keypair:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh/id_ed25519"
    private_key_format: auto
    state: present
    type: ed25519
  register: ssh_key

- name: Read git signing email
  ansible.builtin.command: git config --global user.email
  register: git_signing_email
  changed_when: false

- name: Configure allowed signers for SSH commit signing
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.ssh/allowed_signers"
    content: "{{ git_signing_email.stdout }} {{ ssh_key.public_key }}\n"
    mode: '0644'

- name: Create `.hushlogin` file
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.hushlogin"
    state: touch
    modification_time: preserve
    access_time: preserve
